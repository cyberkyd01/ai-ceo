[project]
name = "ai-ceo"
version = "0.1.0"
description = "Autonomous AI CEO: turns a GitHub repo or VPS deployment into a company that researches, strategizes, markets, ships, and reports."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-ceo = "ai_ceo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_ceo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
